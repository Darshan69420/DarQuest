<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">The Shattered Archive route</title>
  <desc id="desc">Four isolated rooms connect through gated doors: two fights, a rest choice and a boss. Each room has a return gate.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10132d"/><stop offset="1" stop-color="#302450"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#363355"/><stop offset="1" stop-color="#23243e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="500" fill="url(#bg)"/>
  <g fill="none" stroke="#8474bc" opacity=".23"><path d="M0 90H1000M0 250H1000M0 410H1000M75 0V500M250 0V500M500 0V500M750 0V500M925 0V500"/></g>
