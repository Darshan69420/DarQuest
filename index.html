<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sol Mage</title>
  <meta name="description" content="Sol Mage: a 3D fantasy RPG in your browser. Six schools of magic, seven lands, dragons, skills, a roguelike Rift and a homestead to build.">
  <meta name="theme-color" content="#1b140e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>
  <div id="loading"><svg class="ld-hat" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#2a1d14" stroke-width="1.1" stroke-linejoin="round"><path d="M3.8 18.6c2.5-1 5.2-1.5 8.2-1.5s5.7.5 8.2 1.5c-.4 1.3-3.9 2.3-8.2 2.3s-7.8-1-8.2-2.3z" fill="#3e4c7c"/><path d="M7 17.6 11.2 6c.9-2.3 3.6-3.1 5.7-1.8l1.6.9-2.4.3.4 12.2z" fill="#3e4c7c"/></g><path d="M7.4 15.9c3 .6 6 .6 9.1 0" stroke="#e3b04b" stroke-width="1.7" fill="none"/><path d="M12.6 9l.5 1.1 1.2.1-.9.8.3 1.2-1.1-.6-1.1.6.3-1.2-.9-.8 1.2-.1z" fill="#ffe28e"/></svg><div class="ld-title">Sol Mage</div><div class="ld-bar"><div></div></div><div class="ld-tip">Lighting the lamps on Hollow Lane…</div></div>
  <canvas id="game" role="img" aria-label="3D game world"></canvas>
  <div id="labels"></div>

  <!-- Exploration HUD -->
  <div id="hud" class="hidden">
    <div class="hud-card hud-player">
      <div id="hud-name" class="hud-name"></div>
      <div id="hud-school" class="hud-school"></div>
      <div class="bar hp"><div id="hud-hp-fill" class="fill"></div><span id="hud-hp-text"></span></div>
      <div class="bar mp"><div id="hud-mp-fill" class="fill"></div><span id="hud-mp-text"></span></div>
      <div class="bar xp"><div id="hud-xp-fill" class="fill"></div><span id="hud-xp-text"></span></div>
      <div class="hud-stats">
        <span title="Gold">🪙 <b id="hud-gold"></b></span>
        <span title="Potions">🧪 <b id="hud-potions"></b></span>
        <span id="hud-tp-wrap" title="Training Points: spend them at Mirabel's spell table">📘 TP <b id="hud-tp"></b></span>
      </div>
      <div id="buffs"></div>
    </div>
    <div class="hud-card hud-quest">
      <div class="quest-label">📜 Quest</div>
      <div id="quest-title" class="quest-title"></div>
      <div id="quest-goal" class="quest-goal"></div>
      <div id="side-tracker"></div>
    </div>
    <canvas id="minimap" role="img" aria-label="Minimap · click for the World Atlas (N)" title="Minimap · click for the World Atlas (N)"></canvas>
    <div id="clock" aria-hidden="true"></div>
    <div id="rift-hud" class="hud-card hidden"></div>
    <div id="zone-name" class="zone-name" role="status"></div>
    <div class="hud-buttons">
      <button class="btn round" id="btn-char" aria-label="Character, gear and pets (C)" title="Character, gear &amp; pets (C)">🎒</button>
      <button class="btn round" id="btn-bag" aria-label="Materials bag (I)" title="Materials bag (I)">👜</button>
      <button class="btn round" id="btn-skills" aria-label="Skills (K)" title="Skills (K)">📊</button>
      <button class="btn round" id="btn-book" aria-label="Spellbook (B)" title="Spellbook (B)">📖</button>
      <button class="btn round" id="btn-journal" aria-label="Quest journal (J)" title="Quest journal (J)">📜</button>
      <button class="btn round" id="btn-help" aria-label="How to play (?)" title="How to play (?)">❓</button>
      <button class="btn round" id="btn-menu" aria-label="Menu and settings (Escape)" title="Menu &amp; settings (Esc)">☰</button>
    </div>
    <div id="prompt" class="hidden"></div>
    <div id="hint" class="hint-card hidden"></div>
    <div id="build-bar" class="hidden"></div>
    <div id="action-bar" class="hidden"><div class="ab-label"></div><div class="ab-track"><div class="ab-fill"></div></div></div>
  </div>

  <div id="hurt" aria-hidden="true"></div>
  <div id="target-frame" class="hidden"></div>
  <div id="combat-msg" role="status" aria-live="polite"></div>
  <div id="hotbar" class="hidden" role="group" aria-label="Spell hotbar"></div>
  <div id="dialog" class="hidden" role="dialog" aria-label="Conversation"></div>
  <div id="modal" class="hidden" role="dialog" aria-label="Game menu"></div>
  <div id="result" class="hidden" role="dialog" aria-label="Encounter result"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="fade" aria-hidden="true"></div>
  <div id="fps" class="hidden" aria-hidden="true"></div>
  <div id="countdown" class="hidden" role="status"></div>
  <div id="joystick" class="hidden" aria-hidden="true"><div class="knob"></div></div>

  <!-- Title screen -->
  <div id="title">
    <div class="title-box">
      <h1 class="logo"><span class="logo-word">Sol Mage</span><svg class="logo-rule" viewBox="0 0 420 22" aria-hidden="true"><g fill="none" stroke="#c9a25e" stroke-width="1.3" stroke-linecap="round"><path d="M22 11h146M252 11h146"/><path d="M168 11c8 0 10-7 19-7M168 11c8 0 10 7 19 7M252 11c-8 0-10-7-19-7M252 11c-8 0-10 7-19 7"/></g><g stroke="#e8c77a" stroke-width="1.4" stroke-linecap="round"><path d="M210 0.6v2.6M210 18.8v2.6M199.6 11h2.6M215.8 11h2.6M202.6 3.6l1.8 1.8M215.6 16.6l1.8 1.8M217.4 3.6l-1.8 1.8M204.4 16.6l-1.8 1.8"/></g><circle cx="210" cy="11" r="5.4" fill="#e8c77a" stroke="#2a1a0c" stroke-width="1.2"/><circle cx="22" cy="11" r="2" fill="#c9a25e"/><circle cx="398" cy="11" r="2" fill="#c9a25e"/><circle cx="191" cy="11" r="1.8" fill="#e8c77a"/><circle cx="229" cy="11" r="1.8" fill="#e8c77a"/></svg></h1>
      <p class="tagline">The chronicle of a Starfall apprentice</p>
      <div id="slots"></div>
      <div class="title-actions">
        <button class="btn" id="title-settings">⚙️ Settings</button>
        <button class="btn" id="title-import">📥 Import save</button>
        <button class="btn" id="title-wallet">🔮 Sol Mage wallet</button>
      </div>
      <div id="build-tag"></div>
      <div class="new-game hidden">
        <div class="ng-head">New adventure · <span id="ng-slot"></span></div>
        <label for="hero-name">Your wizard's name</label>
        <input id="hero-name" maxlength="24" autocomplete="off">
        <div class="pick-label">Choose your school of magic</div>
        <div id="school-grid"></div>
        <div class="pick-label">Difficulty</div>
        <div id="difficulty-grid"></div>
        <button id="begin" class="btn primary big" disabled>Begin your adventure</button>
        <button id="ng-cancel" class="btn">Back</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
